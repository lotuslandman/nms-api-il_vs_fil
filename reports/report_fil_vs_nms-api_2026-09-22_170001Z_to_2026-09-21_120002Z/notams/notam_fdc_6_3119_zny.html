 AND ARE ARRIVING INTO AND/OR DEPARTING FROM 14 CFR PART 139 AIRPORTS. B. FOR OPERATIONS WITHIN THE TFR, EMERGENCY/LIFE SAVING FLIGHT (MEDICAL/LAW ENFORCEMENT/FIREFIGHTING) OPERATORS MUST COORDINATE IN ADVANCE WITH THE FAA OPERATIONAL MANAGER IN CHARGE AT NEW YORK TRACON AT 516-683-2984, TO AVOID POTENTIAL DELAYS. C. ALL AIRCRAFT MUST SQUAWK THE ATC ASSIGNED DISCRETE BEACON CODE CONTINUOUSLY WHILE OPERATING WITHIN THE TFR. IN THE EVENT OF A TRANSPONDER FAILURE, THE PILOT MUST ADVISE ATC, AND ATC WILL PROVIDE THE MOST DIRECT COURSE TO EXIT THE LATERAL LIMITS OF THE TFR. D. ALL AIRCRAFT MUST REMAIN IN TWO-WAY RADIO COMMUNICATIONS WITH ATC AT ALL TIMES. E. HELICOPTER OPERATIONS ARRIVING AND DEPARTING THE EAST 34TH STREET (6N5) HELIPORTS, AND SEA-PLANE OPERATIONS ARRIVING AND DEPARTING THE EAST 23RD STREET SEAPLANE BASE (6N7), ARE PERMITTED PROVIDED PILOTS COMPLY WITH C AND D ABOVE. AUTHORIZED HELICOPTERS/SEAPLANES MUST FLY ATC ASSIGNED INGRESS/EGRESS ROUTES. F. UAS OPERATORS WHO DO NOT COMPLY WITH APPLICABLE AIRSPACE RESTRICTIONS ARE WARNED THAT PURSUANT TO 10 U.S.C. SECTION 130I AND 6 U.S.C. SECTION 124N, THE DEPARTMENT OF DEFENSE (DOD), THE DEPARTMENT OF HOMELAND SECURITY (DHS) OR THE DEPARTMENT OF JUSTICE (DOJ) MAY TAKE SECURITY ACTION THAT RESULTS IN THE INTERFERENCE, DISRUPTION, SEIZURE, DAMAGING, OR DESTRUCTION OF UNMANNED AIRCRAFT DEEMED TO POSE A CREDIBLE SAFETY OR SECURITY THREAT TO PROTECTED PERSONNEL, FACILITIES, OR ASSETS. G. THE FAA RECOMMENDS THAT ALL AIRCRAFT OPERATORS CHECK NOTAMS FREQUENTLY FOR POSSIBLE CHANGES TO THIS TFR PRIOR TO OPERATIONS WITHIN THIS REGION. OPERATORS MAY REVIEW THE TFR DETAILS ON THE INTERNET AT //TFR.FAA.GOV/ OR //WWW.1800WXBRIEF.COM. IF QUESTIONS REMAIN, CONTACT FLIGHT SERVICE AT 800-992-7433. H. THE NEW YORK /N90/ TRACON, PHONE 516-683-2984, IS THE COORDINATION FACILITY.</text>
