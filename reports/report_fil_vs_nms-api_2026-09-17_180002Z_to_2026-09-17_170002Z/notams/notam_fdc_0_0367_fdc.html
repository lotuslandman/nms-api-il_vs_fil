              <text> SECURITY SPECIAL SECURITY INSTRUCTIONS (SSI) FOR SELECT SPORTING EVENTS. THIS NOTAM REPLACES  FDC NOTAM 7/4319 TO CLARIFY ATC AUTHORIZATION OF TRANSITING FLIGHTS.  THIS NOTAM IMPLEMENTS SECTION 352 OF PUBLIC LAW 108-7 AS AMENDED BY  SECTION 521 OF PUBLIC LAW 108-199. PURSUANT TO 49 USC 40103(B)(3),  THE FEDERAL AVIATION ADMINISTRATION (FAA) CLASSIFIES THE AIRSPACE  DEFINED IN THIS NOTAM AS 'NATIONAL DEFENSE AIRSPACE'. PILOTS WHO DO  NOT ADHERE TO THE FOLLOWING PROCEDURES MAY BE INTERCEPTED, DETAINED AND INTERVIEWED BY LAW ENFORCEMENT/SECURITY PERSONNEL. ANY OF THE FOLLOWING ADDITIONAL ACTIONS MAY ALSO BE TAKEN AGAINST A PILOT WHO DOES NOT COMPLY WITH THE REQUIREMENTS OR ANY SPECIAL INSTRUCTIONS OR PROCEDURES ANNOUNCED IN THIS  A) THE FAA MAY TAKE ADMINISTRATIVE ACTION, INCLUDING IMPOSING CIVIL PENALTIES AND THE SUSPENSION OR REVOCATION OF AIRMEN CERTIFICATES; OR B) THE UNITED STATES GOVERNMENT MAY PURSUE CRIMINAL CHARGES, INCLUDING CHARGES UNDER TITLE 49 OF THE UNITED STATES CODE, SECTION 46307; OR C) THE UNITED STATES GOVERNMENT MAY USE DEADLY FORCE AGAINST THE AIRBORNE AIRCRAFT, IF IT IS DETERMINED THAT THE AIRCRAFT POSES AN IMMINENT SECURITY THREAT.  SECTION I. STADIUM OR SPORTS  PURSUANT TO TITLE 14 CFR SECTION 99.7, SPECIAL SECURITY INSTRUCTIONS, ALL MANNED AND UNMANNED END PART 1 OF 4  SECURITY SPECIAL SECURITY INSTRUCTIONS AIRCRAFT OPERATIONS ARE PROHIBITED EXCEPT AS SPECIFIED BELOW WITHIN AN AREA DEFINED  3 NMR OF A QUALIFYING STADIUM OR OTHER SPORTING VENUE HOSTING A QUALIFYING EVENT UP TO AND INCLUDING 3000FT AGL. QUALIFYING LOCATIONS AND EVENTS ARE DEFINED AS ANY STADIUM OR OTHER SPORTING VENUE HAVING A SEATING CAPACITY OF 30,000 OR MORE  A. A REGULAR OR POST SEASON MAJOR LEAGUE BASEBALL, NATIONAL FOOTBALL LEAGUE, OR NCAA DIVISION ONE FOOTBALL GAME IS OCCURRING; OR B. A NASCAR CUP, INDY CAR, OR CHAMP SERIES RACE IS OCCURRING, EXCLUDING QUALIFYING AND PRE-RACE EVENTS. THIS FLIGHT PROHIBITION IS IN EFFECT ONE HOUR BEFORE THE SCHEDULED START UNTIL ONE HOUR AFTER THE END OF A QUALIFYING EVENT. SECTION II. OPERATING REQUIREMENTS (BASIC): THIS FLIGHT PROHIBITION  APPLIES TO ALL MANNED AND UNMANNED AIRCRAFT OPERATIONS (INCLUDING TRAINING, PARACHUTE JUMPING, AND MODEL AIRCRAFT FLIGHTS) UNLESS THE AIRCRAFT OPERATOR MEETS AT LEAST ONE OF THE FOLLOWING  A. THE AIRCRAFT OPERATION HAS BEEN AUTHORIZED BY ATC FOR OPERATIONAL OR SAFETY PURPOSES, INCLUDING AUTHORIZATION OF FLIGHTS SPECIFICALLY ARRIVING AT OR DEPARTING FROM AN AIRPORT DESIGNATED BY ATC USING STANDARD ATC PROCEDURES AND ROUTES; B. THE AIRCRAFT OPERATION IS BEING CONDUCTED FOR OPERATIONAL, SAFETY, OR SECURITY PURPOSES END PART 2 OF 4  SECURITY SPECIAL SECURITY INSTRUCTIONS SUPPORTING THE QUALIFYING EVENT, AND IS AUTHORIZED BY AN AIRSPACE SECURITY WAIVER APPROVED BY THE FAA; C. THE AIRCRAFT OPERATION IS ENABLING BROADCAST COVERAGE FOR THE BROADCAST RIGHTS HOLDER FOR THE QUALIFYING EVENT, AND IS AUTHORIZED BY AN AIRSPACE SECURITY WAIVER APPROVED BY THE FAA; D. THE AIRCRAFT OPERATION HAS BEEN AUTHORIZED BY ATC FOR NATIONAL SECURITY, HOMELAND SECURITY, LAW ENFORCEMENT, OR AIR AMBULANCE PURPOSES; SECTION III.  A. PILOTS OPERATING IN THE DEFINED AIRSPACE ARE REMINDED THAT AN FAA AIRSPACE SECURITY WAIVER DOES NOT RELIEVE OPERATORS FROM OBTAINING ALL OTHER NECESSARY AUTHORIZATIONS, INCLUDING THOSE SPECIFIC TO FLIGHTS OVER EVENTS HELD IN STADIUMS AND OTHER SPORTING VENUES, AND COMPLYING WITH ALL APPLICABLE FEDERAL AVIATION REGULATIONS. B. PILOTS MUST CONTINUOUSLY SQUAWK AN ATC-ASSIGNED BEACON CODE AND MAINTAIN 2-WAY RADIO CONTACT WITH ATC WHILE OPERATING IN THE DEFINED AIRSPACE. C. UAS OPERATORS WHO DO NOT COMPLY WITH APPLICABLE AIRSPACE RESTRICTIONS ARE WARNED THAT PURSUANT TO 10 U.S.C. SECTION 130I AND 6 U.S.C. SECTION 124N, THE DEPARTMENT OF DEFENSE (DOD), THE DEPARTMENT OF HOMELAND SECURITY (DHS) OR THE DEPARTMENT OF JUSTICE (DOJ) MAY TAKE SECURITY ACTION THAT RESULTS IN THE INTERFERENCE, DISRUPTION, SEIZURE, DAMAGING, OR END PART 3 OF 4  SECURITY SPECIAL SECURITY INSTRUCTIONS DESTRUCTION OF UNMANNED AIRCRAFT DEEMED TO POSE A CREDIBLE SAFETY OR SECURITY THREAT TO PROTECTED PERSONNEL, FACILITIES, OR ASSETS. D. ALL PREVIOUSLY ISSUED WAIVERS TO FDC NOTAM 7/4319 REMAIN VALID UNTIL THE SPECIFIED END DATE BUT NOT TO EXCEED 90 DAYS FOLLOWING THE EFFECTIVE DATE OF THIS NOTAM. INFORMATION ABOUT AIRSPACE SECURITY WAIVER APPLICATIONS AND TSA SECURITY AUTHORIZATIONS CAN BE FOUND AT //WWW.TSA.GOV/STAKEHOLDERS/AIRSPACE-WAIVERS-0 OR BY CALLING TSA AT 571-227-2071. E. SUBMIT REQUESTS FOR FAA AIRSPACE WAIVERS AT //WAIVERS.FAA.GOV. F. FAA RECOMMENDS THAT ALL AIRCRAFT OPERATORS CHECK NOTAMS FREQUENTLY FOR POSSIBLE CHANGES TO THIS TFR PRIOR TO OPERATIONS WITHIN THIS REGION AT //NOTAMS.AIM.FAA.GOV AND SELECT NOTAM SEARCH. G.THE SYSTEM OPERATIONS SUPPORT CENTER (SOSC) IS THE POINT OF CONTACT AND COORDINATION FACILITY FOR ANY QUESTIONS REGARDING THIS NOTAM AND ARE AVAILABLE DAILY FROM 0700-2300 EASTERN, PHONE 202-267-8276. END PART 4 OF 4  </text>
