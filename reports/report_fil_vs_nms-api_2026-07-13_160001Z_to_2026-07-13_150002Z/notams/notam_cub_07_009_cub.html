            if (index === -1) return str;
            const start = str.substring(0, index + search.length);
            const end = str.substring(index + search.length);
            return start + end.split(search).join(replacement);
        }

        let processedA = xmlA;
        let processedB = xmlB;
        const idA = "FNS_ID_81762869";
        const idB = "NMS_ID_8171077143780148";
        
        const numericA = idA.match(/(\d+)$/)?.[1] || idA;
        const numericB = idB.match(/(\d+)$/)?.[1] || idB;

        processedA = replaceAfterFirst(processedA, idA, "*** ID MATCH ***");
        processedA = replaceAfterFirst(processedA, numericA, "*** ID MATCH ***");
        
        processedB = replaceAfterFirst(processedB, idB, "*** ID MATCH ***");
        processedB = replaceAfterFirst(processedB, numericB, "*** ID MATCH ***");

        const patch = Diff.createTwoFilesPatch(
            "FIL (${idA})",
            "NMS-API (${idB})",
            processedA,
            processedB,
            undefined,
            undefined,
            { context: Number.MAX_SAFE_INTEGER }
        );

        const targetElement = document.getElementById("diffViewer");
        const diff2htmlUi = new Diff2HtmlUI(targetElement, patch, {
            drawFileList: false,
            matching: 'lines',
            outputFormat: 'side-by-side',
            colorScheme: 'dark',
            synchronisedScroll: true
        });
        diff2htmlUi.draw();
        if (typeof diff2htmlUi.synchronisedScroll === 'function') {
            diff2htmlUi.synchronisedScroll();
        }
    </script>
