        processedA = replaceAfterFirst(processedA, numericA, "*** ID MATCH ***");
        
        processedB = replaceAfterFirst(processedB, idB, "*** ID MATCH ***");
        processedB = replaceAfterFirst(processedB, numericB, "*** ID MATCH ***");

        const patch = Diff.createTwoFilesPatch(
            "Key: FWA_07/134_FWA_vs_KFWA_A6199/26_FWA | NMS-API (${idA}) | NMS-API-PREPROD (${idB})",
            "Key: FWA_07/134_FWA_vs_KFWA_A6199/26_FWA | NMS-API (${idA}) | NMS-API-PREPROD (${idB})",
            processedA,
            processedB,
            undefined,
            undefined,
            { context: Number.MAX_SAFE_INTEGER }
        );

        const targetElement = document.getElementById("diffViewer");
        const diff2htmlUi = new Diff2HtmlUI(targetElement, patch, {
            drawFileList: false,
            matching: 'lines',
            outputFormat: 'side-by-side',
            colorScheme: 'dark',
            synchronisedScroll: true
        });
        diff2htmlUi.draw();
        if (typeof diff2htmlUi.synchronisedScroll === 'function') {
            diff2htmlUi.synchronisedScroll();
        }
    </script>
</body>
</html>
