            if (!str || !search || search === "N/A") return str;
            const index = str.indexOf(search);
            if (index === -1) return str;
            const start = str.substring(0, index + search.length);
            const end = str.substring(index + search.length);
            return start + end.split(search).join(replacement);
        }

        let processedA = xmlA;
        let processedB = xmlB;
        const idA = "FNS_ID_76124975";
        const idB = "NMS_ID_1758720210823464";

        const numericB = idB.match(/(\d+)$/)?.[1] || idB;

        processedA = replaceAfterFirst(processedA, idA, "*** ID MATCH ***");
        processedA = replaceAfterFirst(processedA, numericA, "*** ID MATCH ***");
        
        processedB = replaceAfterFirst(processedB, idB, "*** ID MATCH ***");
        processedB = replaceAfterFirst(processedB, numericB, "*** ID MATCH ***");

        const patch = Diff.createTwoFilesPatch(

            "Key: FDC_5/8018_SLC | FIL (${idA}) | NMS-API (${idB})",
