            return start + end.split(search).join(replacement);
        }

        let processedA = xmlA;
        let processedB = xmlB;
        const idA = "NMS_ID_1770437081575150";
        const idB = "NMS_ID_1770437081575150";
        
        const numericA = idA.match(/(\d+)$/)?.[1] || idA;
